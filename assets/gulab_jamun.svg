<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="jamunPlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ebdcd0" />
    </radialGradient>
    <radialGradient id="gjGrad1" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#9a5323" />
      <stop offset="50%" stop-color="#5c2c16" />
      <stop offset="90%" stop-color="#3b1b0b" />
      <stop offset="100%" stop-color="#240f06" />
    </radialGradient>
    <radialGradient id="gjGrad2" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#a45325" />
      <stop offset="60%" stop-color="#6a3317" />
      <stop offset="100%" stop-color="#2d1307" />
    </radialGradient>
    <filter id="gjShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5c2c16" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="#fbf9f6" />

  <!-- Dessert Glass / Porcelain Bowl -->
  <g filter="url(#gjShadow)">
    <ellipse cx="200" cy="160" rx="140" ry="90" fill="#caa076" />
    <ellipse cx="200" cy="158" rx="130" ry="82" fill="url(#jamunPlate)" />

    <!-- Aromatic Cardamom Sugar Syrup Pool (Chashni) -->
    <ellipse cx="200" cy="162" rx="100" ry="58" fill="#fde68a" opacity="0.65" />
    <ellipse cx="195" cy="160" rx="90" ry="50" fill="#f59e0b" opacity="0.45" />

    <!-- Gulab Jamun 1 (Back Left) -->
    <circle cx="165" cy="150" r="38" fill="url(#gjGrad1)" />
    <!-- Glossy Glaze Highlight -->
    <ellipse cx="152" cy="138" rx="14" ry="7" fill="#de884b" opacity="0.6" transform="rotate(-20 152 138)" />
    <ellipse cx="148" cy="134" rx="6" ry="3" fill="#ffffff" opacity="0.4" transform="rotate(-20 148 134)" />

    <!-- Gulab Jamun 2 (Front Right) -->
    <circle cx="230" cy="165" r="42" fill="url(#gjGrad2)" />
    <!-- Glossy Glaze Highlight -->
    <ellipse cx="215" cy="150" rx="16" ry="8" fill="#f1b37e" opacity="0.5" transform="rotate(-25 215 150)" />
    <ellipse cx="212" cy="146" rx="7" ry="3.5" fill="#ffffff" opacity="0.5" transform="rotate(-25 212 146)" />

    <!-- Saffron Strands floating in syrup -->
    <path d="M 185 185 Q 195 190 205 186" stroke="#dc2626" stroke-width="2" fill="none" />
    <path d="M 260 170 Q 270 176 276 168" stroke="#dc2626" stroke-width="2" fill="none" />

    <!-- Crushed Pistachio and Silver Foil (Vark) Flakes -->
    <!-- Pistachio pieces -->
    <polygon points="160,135 166,132 164,138" fill="#65a30d" />
    <polygon points="172,142 176,139 174,145" fill="#84cc16" />
    <polygon points="225,145 232,142 229,149" fill="#65a30d" />
    <polygon points="240,155 245,152 244,158" fill="#84cc16" />
    <!-- Silver vark flake -->
    <polygon points="220,158 226,155 228,162 222,163" fill="#ffffff" opacity="0.85" />
    <polygon points="155,145 159,142 161,147 157,148" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
