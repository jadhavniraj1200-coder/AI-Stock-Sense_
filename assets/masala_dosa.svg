<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="dosaPlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ede3d7" />
    </radialGradient>
    <linearGradient id="dosaCrust" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="35%" stop-color="#b45309" />
      <stop offset="70%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="dShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5c2c16" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="#fbf9f6" />

  <!-- Banana Leaf Platter Plate -->
  <g filter="url(#dShadow)">
    <ellipse cx="200" cy="155" rx="170" ry="105" fill="#15803d" />
    <ellipse cx="200" cy="155" rx="164" ry="98" fill="#16a34a" />
    <!-- Leaf veins -->
    <path d="M 40 155 Q 200 150 360 155" stroke="#14532d" stroke-width="2.5" fill="none" opacity="0.4" />
    <path d="M 90 120 L 140 155" stroke="#14532d" stroke-width="1.5" opacity="0.3" />
    <path d="M 180 115 L 210 152" stroke="#14532d" stroke-width="1.5" opacity="0.3" />
    <path d="M 270 120 L 290 155" stroke="#14532d" stroke-width="1.5" opacity="0.3" />

    <!-- Crispy Golden Rolled Dosa -->
    <g transform="translate(195, 140) rotate(-14)">
      <!-- Main cylinder body -->
      <path d="M -110 -22 L 120 -15 C 135 -15, 140 25, 120 28 L -110 20 C -125 18, -125 -20, -110 -22 Z" fill="url(#dosaCrust)" />
      <!-- Top crispy highlight -->
      <path d="M -90 -16 L 90 -12" stroke="#fde68a" stroke-width="3" stroke-linecap="round" opacity="0.7" />
      <path d="M -80 0 L 100 5" stroke="#78350f" stroke-width="4" stroke-dasharray="8,14" opacity="0.5" />
      <!-- Ghee sheen -->
      <ellipse cx="10" cy="-6" rx="60" ry="6" fill="#fef08a" opacity="0.4" />
    </g>

    <!-- Katori 1: Coconut Chutney -->
    <circle cx="85" cy="195" r="26" fill="#caa076" />
    <circle cx="85" cy="195" r="23" fill="#ffffff" />
    <!-- Tadka mustard & curry leaves -->
    <circle cx="82" cy="192" r="1.5" fill="#1e293b" />
    <circle cx="88" cy="196" r="1.5" fill="#1e293b" />
    <circle cx="84" cy="198" r="1.5" fill="#1e293b" />
    <ellipse cx="86" cy="190" rx="4" ry="2" fill="#15803d" />

    <!-- Katori 2: Tomato Red Chutney -->
    <circle cx="145" cy="215" r="24" fill="#caa076" />
    <circle cx="145" cy="215" r="21" fill="#dc2626" />
    <ellipse cx="143" cy="213" rx="12" ry="7" fill="#ef4444" />

    <!-- Katori 3: Piping Hot Sambar -->
    <circle cx="310" cy="190" r="28" fill="#caa076" />
    <circle cx="310" cy="190" r="25" fill="#c2410c" />
    <ellipse cx="308" cy="188" rx="16" ry="10" fill="#ea580c" />
    <circle cx="305" cy="185" r="3" fill="#15803d" />
  </g>
</svg>
