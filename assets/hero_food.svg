<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="heroBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffcf7" />
      <stop offset="60%" stop-color="#f5e8db" />
      <stop offset="100%" stop-color="#e2cfbf" />
    </radialGradient>
    <linearGradient id="bronzePlatter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="30%" stop-color="#aa7c11" />
      <stop offset="70%" stop-color="#785208" />
      <stop offset="100%" stop-color="#4d3204" />
    </linearGradient>
    <filter id="heroShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#3b1b0b" flood-opacity="0.32" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#heroBgGrad)" />

  <!-- Wooden Table Texture Lines -->
  <path d="M 0 120 Q 400 135 800 120" stroke="#d5beaa" stroke-width="2" fill="none" opacity="0.4" />
  <path d="M 0 320 Q 400 335 800 320" stroke="#d5beaa" stroke-width="2" fill="none" opacity="0.3" />
  <path d="M 0 490 Q 400 505 800 490" stroke="#d5beaa" stroke-width="2" fill="none" opacity="0.4" />

  <!-- Grand Thali Platter -->
  <g filter="url(#heroShadow)">
    <circle cx="400" cy="310" r="240" fill="url(#bronzePlatter)" />
    <circle cx="400" cy="310" r="228" fill="#fdfbf7" />
    <circle cx="400" cy="310" r="220" fill="#f5ede3" />

    <!-- Center Dish: Royal Paneer Butter Masala -->
    <g transform="translate(0, 0)">
      <circle cx="400" cy="310" r="95" fill="#9a5323" stroke="#ffd700" stroke-width="3" />
      <circle cx="400" cy="310" r="88" fill="#c2410c" />
      <!-- Cream swirl -->
      <path d="M 360 290 Q 410 260 435 300 Q 445 340 390 345 Q 360 325 385 305" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.9" />
      <!-- Paneer Cubes -->
      <rect x="375" y="295" width="28" height="24" rx="4" fill="#fffefb" stroke="#e6dfd5" transform="rotate(15 380 300)" />
      <rect x="415" y="315" width="24" height="22" rx="4" fill="#fffefb" stroke="#e6dfd5" transform="rotate(-20 420 320)" />
      <rect x="365" y="330" width="22" height="20" rx="3" fill="#fffefb" stroke="#e6dfd5" transform="rotate(5 370 335)" />
      <!-- Garnish -->
      <circle cx="395" cy="275" r="4" fill="#16a34a" />
      <circle cx="425" cy="290" r="3.5" fill="#16a34a" />
    </g>

    <!-- Katori 1: Golden Dal Tadka (Top Left) -->
    <g transform="translate(240, 195)">
      <circle cx="0" cy="0" r="54" fill="#b45309" stroke="#d4af37" stroke-width="2.5" />
      <circle cx="0" cy="0" r="49" fill="#eab308" />
      <!-- Cumin & Tadka Chilli -->
      <ellipse cx="-5" cy="-2" rx="15" ry="8" fill="#ca8a04" opacity="0.7" />
      <path d="M -15 8 Q 0 -8 18 -2" stroke="#dc2626" stroke-width="4.5" fill="none" stroke-linecap="round" />
      <circle cx="6" cy="12" r="3" fill="#16a34a" />
      <circle cx="-12" cy="-14" r="2.5" fill="#451a03" />
    </g>

    <!-- Katori 2: Fragrant Biryani / Rice (Top Right) -->
    <g transform="translate(560, 195)">
      <circle cx="0" cy="0" r="54" fill="#9a5323" stroke="#d4af37" stroke-width="2.5" />
      <circle cx="0" cy="0" r="49" fill="#fef3c7" />
      <!-- Grains & Saffron -->
      <path d="M -25 -10 Q 0 -30 25 -8 Q 30 20 -5 25 Q -30 15 -25 -10" fill="#fde68a" />
      <ellipse cx="5" cy="-5" rx="20" ry="12" fill="#f59e0b" opacity="0.6" />
      <!-- Fried Onion & Mint -->
      <path d="M -12 -8 Q -2 4 14 0" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />
      <circle cx="2" cy="10" r="3" fill="#16a34a" />
      <circle cx="-14" cy="5" r="2.5" fill="#16a34a" />
    </g>

    <!-- Katori 3: Creamy Raita / Dahi (Bottom Right) -->
    <g transform="translate(555, 420)">
      <circle cx="0" cy="0" r="50" fill="#b45309" stroke="#d4af37" stroke-width="2.5" />
      <circle cx="0" cy="0" r="45" fill="#ffffff" />
      <!-- Boondi & spices -->
      <circle cx="-10" cy="-6" r="5" fill="#f59e0b" />
      <circle cx="12" cy="4" r="5" fill="#f59e0b" />
      <circle cx="-4" cy="14" r="4.5" fill="#f59e0b" />
      <circle cx="8" cy="-14" r="4" fill="#f59e0b" />
      <path d="M -15 0 Q 0 8 15 -3" stroke="#991b1b" stroke-width="1.5" stroke-dasharray="2,3" fill="none" />
      <circle cx="2" cy="-2" r="3" fill="#16a34a" />
    </g>

    <!-- Katori 4: Gulab Jamun Sweet (Bottom Left) -->
    <g transform="translate(245, 420)">
      <circle cx="0" cy="0" r="50" fill="#9a5323" stroke="#d4af37" stroke-width="2.5" />
      <circle cx="0" cy="0" r="45" fill="#fef3c7" />
      <!-- Gulab Jamun Dumplings -->
      <circle cx="-8" cy="4" r="18" fill="#522711" stroke="#3b1b0b" stroke-width="1" />
      <ellipse cx="-13" cy="-1" rx="6" ry="3" fill="#85411d" />
      <circle cx="12" cy="-4" r="17" fill="#5c2c16" stroke="#3b1b0b" stroke-width="1" />
      <ellipse cx="8" cy="-8" rx="5" ry="2.5" fill="#85411d" />
      <!-- Pistachio Flakes -->
      <polygon points="-8,-4 -5,-7 -3,-5" fill="#84cc16" />
      <polygon points="12,-12 15,-15 17,-13" fill="#84cc16" />
    </g>

    <!-- Warm Butter Naan Triangles on Side (Top edge) -->
    <g transform="translate(400, 140) rotate(-6)">
      <path d="M -70 20 Q 0 -25 70 20 Q 35 45 -70 20" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
      <!-- Char marks & butter -->
      <ellipse cx="-20" cy="10" rx="9" ry="4" fill="#78350f" opacity="0.6" />
      <ellipse cx="25" cy="8" rx="8" ry="4" fill="#78350f" opacity="0.6" />
      <ellipse cx="5" cy="16" rx="12" ry="5" fill="#fde047" />
      <circle cx="-5" cy="8" r="2.5" fill="#15803d" />
      <circle cx="15" cy="18" r="2" fill="#15803d" />
    </g>
  </g>

  <!-- Steaming Scent Trails -->
  <path d="M 370 230 Q 360 170 380 120" stroke="#ffffff" stroke-width="4.5" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 420 220 Q 440 160 425 110" stroke="#ffffff" stroke-width="5" fill="none" opacity="0.7" stroke-linecap="round" />
</svg>
