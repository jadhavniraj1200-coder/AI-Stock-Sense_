<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="biryaniPlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbf5" />
      <stop offset="100%" stop-color="#e2d2c1" />
    </radialGradient>
    <filter id="bShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5c2c16" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="#fbf9f6" />

  <!-- Ceramic Platter -->
  <g filter="url(#bShadow)">
    <ellipse cx="200" cy="160" rx="160" ry="105" fill="#caa076" />
    <ellipse cx="200" cy="158" rx="150" ry="98" fill="url(#biryaniPlate)" />

    <!-- Biryani Rice Mound -->
    <ellipse cx="200" cy="155" rx="125" ry="78" fill="#fef08a" />
    <ellipse cx="190" cy="148" rx="110" ry="68" fill="#fde047" opacity="0.6" />
    <ellipse cx="210" cy="152" rx="90" ry="55" fill="#f59e0b" opacity="0.4" />

    <!-- Individual Rice Grains and Saffron Streaks -->
    <path d="M 120 160 Q 150 140 180 155 Q 230 135 270 165" stroke="#fef9c3" stroke-width="6" fill="none" opacity="0.8" />
    <path d="M 140 145 Q 180 130 220 142" stroke="#ea580c" stroke-width="4" fill="none" opacity="0.7" />
    <path d="M 160 170 Q 200 155 250 168" stroke="#ca8a04" stroke-width="5" fill="none" opacity="0.6" />

    <!-- Fried Brown Onions (Birista) -->
    <path d="M 170 135 Q 185 142 205 132" stroke="#522711" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M 195 155 Q 220 160 235 148" stroke="#451a03" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 145 158 Q 160 162 175 154" stroke="#5c2c16" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Carrot & Green Peas -->
    <circle cx="150" cy="140" r="5" fill="#16a34a" />
    <circle cx="185" cy="165" r="5.5" fill="#16a34a" />
    <circle cx="230" cy="138" r="5" fill="#16a34a" />
    <circle cx="255" cy="160" r="4.5" fill="#16a34a" />
    <rect x="175" y="148" width="8" height="6" rx="2" fill="#ea580c" />
    <rect x="210" y="162" width="7" height="6" rx="2" fill="#ea580c" />

    <!-- Cashews and Raisins -->
    <path d="M 220 145 C 228 140, 235 150, 224 153" fill="#fdfbf7" stroke="#d5beaa" stroke-width="1.5" />
    <ellipse cx="165" cy="152" rx="4" ry="2.5" fill="#3b1b0b" />

    <!-- Fresh Mint Sprig -->
    <g transform="translate(198, 128)">
      <path d="M 0 0 C -12 -14, -4 -25, 2 -18 C 8 -25, 16 -14, 0 0" fill="#22c55e" stroke="#15803d" stroke-width="1" />
    </g>
  </g>

  <!-- Steam lines -->
  <path d="M 180 110 Q 170 85 185 65" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 215 105 Q 225 80 210 60" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />
</svg>
