<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="dalGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
    <filter id="dalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5c2c16" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="#fbf9f6" />

  <!-- Brass Handi / Bowl -->
  <g filter="url(#dalShadow)">
    <circle cx="200" cy="150" r="105" fill="#a45325" />
    <circle cx="200" cy="150" r="98" fill="#78350f" />
    <circle cx="200" cy="150" r="88" fill="url(#dalGrad)" />

    <!-- Sizzling Desi Ghee & Chilli Tadka -->
    <ellipse cx="200" cy="148" rx="60" ry="38" fill="#ea580c" opacity="0.35" />
    <!-- Whole Red Chillies -->
    <path d="M 160 160 Q 185 130 220 145" stroke="#b91c1c" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M 180 135 Q 210 115 240 130" stroke="#dc2626" stroke-width="5" fill="none" stroke-linecap="round" />

    <!-- Cumin Seeds (Jeera) & Mustard Tadka -->
    <g fill="#451a03">
      <ellipse cx="170" cy="140" rx="3" ry="1.5" transform="rotate(25 170 140)" />
      <ellipse cx="190" cy="155" rx="3" ry="1.5" transform="rotate(-15 190 155)" />
      <ellipse cx="225" cy="150" rx="3.5" ry="1.5" transform="rotate(40 225 150)" />
      <ellipse cx="205" cy="130" rx="3" ry="1.5" transform="rotate(10 205 130)" />
      <ellipse cx="155" cy="150" rx="3" ry="1.5" transform="rotate(-30 155 150)" />
      <ellipse cx="215" cy="165" rx="3" ry="1.5" transform="rotate(15 215 165)" />
    </g>

    <!-- Fresh Coriander & Garlic Bits -->
    <g fill="#15803d">
      <circle cx="175" cy="125" r="3.5" />
      <circle cx="182" cy="120" r="3" />
      <circle cx="230" cy="160" r="3.5" />
      <circle cx="240" cy="155" r="3" />
      <circle cx="195" cy="170" r="3" />
      <!-- Golden fried garlic -->
      <circle cx="185" cy="145" r="3" fill="#fde68a" stroke="#b45309" stroke-width="0.8" />
      <circle cx="210" cy="140" r="3" fill="#fde68a" stroke="#b45309" stroke-width="0.8" />
    </g>
  </g>

  <!-- Steam -->
  <path d="M 185 100 Q 175 75 190 55" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 215 95 Q 225 70 210 50" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.6" stroke-linecap="round" />
</svg>
